project:
  name: assignment4_code_rag
  track: B
  seed: 42

dataset:
  name: code_search_net
  config: python
  split: train
  starter_size: 1000

embedding:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 64
  normalize_embeddings: true

vector_db:
  path: artifacts/chroma_code
  collection_name: csn_python
  distance_metric: cosine

retrieval:
  top_k: 4

generator:
  model_name: Qwen/Qwen3-8B
  base_url: http://149.165.171.140:8888/v1
  temperature: 0.0
  max_tokens: 512
  timeout_seconds: 30

paths:
  custom_functions_dir: data/custom_functions
  part1_queries: data/queries/part1_queries.json
  part2_targeted_queries: data/queries/part2_targeted_queries.json
  part2_cross_queries: data/queries/part2_cross_corpus_queries.json
  results_dir: artifacts/results
